<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloodSaathi – Alert preferences</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ef1c24;--navy:#12172b;--ink2:#2a3150;--muted:#8a93a7;--chat:#f1f2f6;--page:#e9e7ea;--line:#eceef3}
@media (prefers-color-scheme:dark){:root{--page:#17171a}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:560px;height:100vh;height:100dvh;background:#fff;overflow:hidden}
@media (min-width:600px){.app{margin:max(0px,calc((100dvh - 880px)/2)) 0;height:min(100dvh,880px);border-radius:28px;box-shadow:0 18px 60px rgba(20,25,45,.18)}}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px))}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.lead{margin-top:8px;font-size:16px;line-height:1.45;color:var(--muted)}
@media (min-width:480px) and (min-height:760px){h1{font-size:32px}}

ul{list-style:none;padding:0;margin-top:18px}
.row{display:flex;align-items:center;gap:16px;min-height:68px;padding:10px 0;border-bottom:1px solid var(--line)}
.ic{flex:none;width:34px;height:34px;display:grid;place-items:center;color:#4a5268}
.ic svg{width:28px;height:28px}
.tx{flex:1;min-width:0;display:grid;gap:3px}
.t1{font-size:17px;font-weight:600;line-height:1.3}
.sub2{font-size:14px;line-height:1.4;color:var(--muted)}

/* switch */
.sw{flex:none;position:relative;width:54px;height:32px;border:0;border-radius:16px;background:#dfe2e9;cursor:pointer;transition:background .18s;padding:0}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(20,30,50,.25);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"] i{transform:translateX(22px)}
@media (prefers-reduced-motion:reduce){.sw,.sw i{transition:none}}

/* radius */
.radius{padding:18px 0 14px;border-bottom:1px solid var(--line)}
.radius .head{display:flex;align-items:center;gap:16px}
.slider{--f:.5;--th:26px;position:relative;margin:18px 0 0 0}
.slider input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;margin:0;background:transparent;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) calc((100% - var(--th))*var(--f) + var(--th)/2),#e3e6ee 0)}
.slider input::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--red) calc((100% - var(--th))*var(--f) + var(--th)/2),#e3e6ee 0)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:var(--th);height:var(--th);margin-top:-10px;border-radius:50%;background:var(--red);border:4px solid #fff;box-shadow:0 0 0 1.5px var(--red),0 3px 8px rgba(239,28,36,.35)}
.slider input::-moz-range-thumb{width:calc(var(--th) - 8px);height:calc(var(--th) - 8px);border-radius:50%;background:var(--red);border:4px solid #fff;box-shadow:0 0 0 1.5px var(--red),0 3px 8px rgba(239,28,36,.35)}
.ticks{position:relative;height:22px;margin-top:6px}
.ticks button{position:absolute;white-space:nowrap;top:0;transform:translateX(-50%);border:0;background:none;padding:4px 6px;font:500 14px Inter,sans-serif;color:var(--muted);cursor:pointer;border-radius:8px}
.ticks button[aria-pressed="true"]{color:var(--navy);font-weight:600}

.row.last{border-bottom:0}
/* bottom navigation */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #eceef3;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:12px;color:var(--ink2);text-decoration:none;font:500 12.5px/1.2 Inter,sans-serif;min-height:56px}
.nav a:hover{background:var(--chat)}
.nav svg{width:26px;height:26px}
.nav a[aria-current="page"]{color:var(--red);font-weight:600}
@media (min-width:600px){.nav{border-radius:0 0 28px 28px}}

button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
</style></head>
<body>
<main class="app">
  <div class="scroll">
    <h1>Alert Preferences</h1>
    <p class="lead">Get notified based on your location and risk level.</p>

    <ul>
      <li class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8c1.5 0 1.5 1.3 3 1.3S7.5 8 9 8s1.5 1.3 3 1.3S13.5 8 15 8s1.5 1.3 3 1.3S19.5 8 21 8M3 13c1.5 0 1.5 1.3 3 1.3S7.5 13 9 13s1.5 1.3 3 1.3 1.5-1.3 3-1.3 1.5 1.3 3 1.3S19.5 13 21 13M3 18c1.5 0 1.5 1.3 3 1.3S7.5 18 9 18s1.5 1.3 3 1.3 1.5-1.3 3-1.3 1.5 1.3 3 1.3S19.5 18 21 18"/><path d="M12 3v2.5"/></svg></span>
        <span class="tx"><span class="t1" id="flood-l">Flood Warnings</span><span class="sub2">River level rise, possible flooding</span></span>
        <button class="sw" role="switch" aria-checked="true" aria-labelledby="flood-l"><i></i></button>
      </li>
      <li class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v3.5H3zM4.5 10h15l-1.2 9.5H5.7z" opacity=".95"/><path d="M8 11.5v6M12 11.5v6M16 11.5v6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></span>
        <span class="tx"><span class="t1" id="dam-l">Dam Release Updates</span></span>
        <button class="sw" role="switch" aria-checked="true" aria-labelledby="dam-l"><i></i></button>
      </li>
      <li class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 17.5a4.2 4.2 0 0 1-.6-8.4A5.6 5.6 0 0 1 17 8.3a4.6 4.6 0 0 1 .5 9.2z"/></svg></span>
        <span class="tx"><span class="t1" id="rain-l">Heavy Rain Alerts</span></span>
        <button class="sw" role="switch" aria-checked="true" aria-labelledby="rain-l"><i></i></button>
      </li>
      <li class="row">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg></span>
        <span class="tx"><span class="t1" id="wx-l">Weather Warnings</span></span>
        <button class="sw" role="switch" aria-checked="false" aria-labelledby="wx-l"><i></i></button>
      </li>
    </ul>

    <section class="radius" aria-labelledby="rad-t">
      <div class="head">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#ef1c24" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="#ef1c24"/></svg></span>
        <span class="tx"><span class="t1" id="rad-t">Alert Radius</span><span class="sub2" id="rad-s">Notify me within 10 km</span></span>
      </div>
      <div class="slider" id="slider">
        <input type="range" id="rad" min="0" max="2" step="1" value="1" aria-labelledby="rad-t" aria-valuetext="10 kilometres">
      </div>
      <div class="ticks" id="ticks"></div>
    </section>

    <ul>
      <li class="row last">
        <span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg></span>
        <span class="tx"><span class="t1" id="quiet-l">Quiet Hours</span><span class="sub2">10:00 PM – 6:00 AM</span></span>
        <button class="sw" role="switch" aria-checked="false" aria-labelledby="quiet-l"><i></i></button>
      </li>
    </ul>
  </div>
  <nav class="nav" aria-label="Main">
    <a href="#home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>Map</a>
    <a href="#saathi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M11 4.5H8a4 4 0 0 0-4 4v4.2a4 4 0 0 0 4 4h.5V20l3.8-3.3H14a4 4 0 0 0 4-4V11"/><circle cx="17.5" cy="6.5" r="2.5"/><path d="M8.5 10.5h.01M12.5 10.5h.01"/></svg>Saathi</a>
    <a href="#alerts" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0M12 3v2"/></svg>Alerts</a>
    <a href="#more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>More</a>
  </nav>
</main>
<script>
(function(){
  document.querySelectorAll('.sw').forEach(function(b){
    b.addEventListener('click',function(){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true');});
  });
  var vals=[5,10,20],r=document.getElementById('rad'),s=document.getElementById('slider'),
      txt=document.getElementById('rad-s'),tk=document.getElementById('ticks'),th=26,btns=[];
  vals.forEach(function(v,i){
    var b=document.createElement('button');b.type='button';b.textContent=v+' km';
    b.addEventListener('click',function(){r.value=i;upd();});
    tk.appendChild(b);btns.push(b);
  });
  function upd(){
    var i=+r.value;s.style.setProperty('--f',i/2);
    txt.textContent='Notify me within '+vals[i]+' km';
    r.setAttribute('aria-valuetext',vals[i]+' kilometres');
    btns.forEach(function(b,j){b.setAttribute('aria-pressed',j===i);b.style.left='calc('+th/2+'px + (100% - '+th+'px) * '+j/2+')';});
  }
  r.addEventListener('input',upd);upd();
})();
</script>
</body></html>
