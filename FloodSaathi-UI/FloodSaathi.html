.logo{position:absolute;left:6cqw;top:4%;width:19cqw;height:19cqw;border-radius:22%;overflow:hidden;box-shadow:0 2cqw 5cqw rgba(238,28,37,.28)}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);display:block}
h1{position:absolute;left:5.8cqw;top:17.1%;font:600 12.2cqw/1.1 'Plus Jakarta Sans',Inter,sans-serif;letter-spacing:-.035em;color:var(--navy)}
h1 span{color:var(--red)}

.tag{position:absolute;left:6cqw;top:26.1%;font:400 5.6cqw/1.11 Inter,sans-serif;letter-spacing:-.01em;color:var(--slate)}
.card{position:absolute;left:2.7cqw;right:4.3cqw;top:59%;padding:0;border-radius:5cqw;background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 3cqw 9cqw rgba(30,35,60,.1),inset 0 0 0 1px rgba(255,255,255,.7)}
.langs{display:flex;align-items:center;padding:0 0 0 4%;height:19.4cqw}
.lang{border:0;background:none;font:500 4.2cqw Inter,sans-serif;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3cqw;height:100%;border-radius:3.6cqw}
.lang{height:11.4cqw}.lang:first-child{width:31.6%;flex:none}
.lang.pa{width:30%;margin-left:3%;flex:none}.lang.hi{width:28%;flex:none}
.lang[aria-pressed=true]{background:#fde3e5}
.radio{width:4.6cqw;height:4.6cqw;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.radio::after{content:"";width:1.8cqw;height:1.8cqw;border-radius:50%;background:#fff}
.pa{font-family:'Noto Sans Gurmukhi',Inter,sans-serif;font-size:4.6cqw}.hi{font-family:'Noto Sans Devanagari',Inter,sans-serif;font-size:4.6cqw}
.loc{display:flex;align-items:center;gap:4.5cqw;width:100%;height:19.7cqw;padding:0 4.5cqw;border:0;border-radius:4.5cqw;background:rgba(255,255,255,.7);text-align:left;cursor:pointer;font-family:Inter,sans-serif;color:var(--navy)}

.pin{width:12cqw;height:12cqw;border-radius:3.2cqw;background:#eff0f4;display:grid;place-items:center;flex:none}

.loc b{display:block;font-size:3.8cqw;font-weight:600}
.loc small{display:block;margin-top:.8cqw;font-size:3.8cqw;color:var(--slate)}
.chev{margin-left:auto}
.manual{position:absolute;left:6cqw;top:85.7%;transform:translateY(-50%);background:none;border:0;font:600 4.4cqw Inter,sans-serif;color:var(--navy);cursor:pointer;display:flex;align-items:center;gap:2.5cqw}
.go{position:absolute;right:4cqw;bottom:3.6%;width:20.9cqw;height:20.9cqw;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f5353d,var(--red));display:grid;place-items:center;box-shadow:0 3cqw 7cqw rgba(238,28,37,.38);cursor:pointer}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
