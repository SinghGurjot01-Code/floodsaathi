.fab{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 15px rgba(30,40,70,.14);border:0;padding:0;cursor:pointer;display:grid;place-items:center}

  .head{gap:10px}.h{font-size:16px}.s{font-size:15px}.d{font-size:14px}
}

<main class="app">
  <div class="pane">
