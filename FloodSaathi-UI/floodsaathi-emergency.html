<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FloodSaathi – Emergency</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#ef1c24;--red2:#e8141c;--navy:#12172b;--ink2:#2a3150;--muted:#8a93a7;--chat:#f1f2f6;--page:#e9e7ea}
@media (prefers-color-scheme:dark){:root{--page:#17171a}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,system-ui,sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:560px;height:100vh;height:100dvh;background:linear-gradient(180deg,#fff 0%,#fff 38%,#f3f4f7 100%);overflow:hidden}
@media (min-width:600px){.app{margin:max(0px,calc((100dvh - 880px)/2)) 0;height:min(100dvh,880px);border-radius:28px;box-shadow:0 18px 60px rgba(20,25,45,.18)}}

.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:calc(26px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 22px max(20px,env(safe-area-inset-left,0px))}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sub{margin-top:8px;font-size:16px;color:var(--muted)}

/* SOS */
.sos-wrap{position:relative;display:grid;place-items:center;margin:clamp(4px,2vh,20px) auto 0;width:min(100%,300px);aspect-ratio:1/1}
.ring{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(239,28,36,.10),rgba(239,28,36,.04));pointer-events:none}
.r1{width:100%;height:100%;background:radial-gradient(circle,rgba(239,28,36,.07) 55%,rgba(239,28,36,0) 72%)}
.r2{width:82%;height:82%;background:rgba(239,28,36,.06)}
.r3{width:66%;height:66%;background:rgba(239,28,36,.09)}
.sos{position:relative;width:52%;aspect-ratio:1/1;border-radius:50%;border:5px solid #fff;background:radial-gradient(circle at 50% 35%,#f23a3f,#e11b22 70%);box-shadow:0 0 0 1px rgba(239,28,36,.25),0 14px 34px rgba(239,28,36,.42);color:#fff;font:500 clamp(34px,10vw,46px)/1 Inter,sans-serif;letter-spacing:.01em;cursor:pointer;transition:transform .12s}
.sos:active{transform:scale(.96)}
@media (prefers-reduced-motion:no-preference){
  .r2{animation:pulse 3.2s ease-in-out infinite}
  .r3{animation:pulse 3.2s ease-in-out .5s infinite}
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.tap{margin-top:6px;text-align:center;font-size:19px;font-weight:700;color:var(--red)}
.desc{margin:10px auto 0;max-width:290px;text-align:center;font-size:15px;line-height:1.55;color:#6f7890}

/* quick actions */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
.q{display:flex;align-items:center;justify-content:center;gap:12px;height:62px;border-radius:16px;background:#fbe9ea;border:1px solid #f6d5d7;color:var(--red);font:600 17px Inter,sans-serif;text-decoration:none;transition:background .12s}
.q:hover{background:#f9dfe1}
.q svg{width:24px;height:24px;flex:none}

/* family check-in */
.fam{margin-top:20px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 2px 14px rgba(30,40,70,.07)}
.fam-row{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.av{flex:none;width:54px;height:54px;border-radius:50%;background:#fbe9ea;display:grid;place-items:center}
.av svg{width:28px;height:28px}
.fam-t{flex:1;min-width:0}
.fam-t b{display:block;font-size:17px;font-weight:700}
.fam-t span{display:block;margin-top:3px;font-size:15px;color:#4a5268;line-height:1.4}
.chev{flex:none;width:20px;height:20px;color:var(--navy)}
.safe{display:inline-flex;align-items:center;gap:10px;margin-top:16px;height:48px;padding:0 22px 0 14px;border:0;border-radius:24px;background:#e4f3e9;color:#12172b;font:600 16px Inter,sans-serif;cursor:pointer}
.safe i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#16a05a}
.safe svg{width:15px;height:15px}
.safe:hover{background:#d8eee0}

/* bottom navigation */
.nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #eceef3;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 6px;border-radius:12px;color:var(--ink2);text-decoration:none;font:500 12.5px/1.2 Inter,sans-serif;min-height:56px}
.nav a:hover{background:var(--chat)}
.nav svg{width:26px;height:26px}
.nav a[aria-current="page"]{color:var(--red);font-weight:600}
@media (min-width:600px){.nav{border-radius:0 0 28px 28px}}

a:focus-visible,button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
@media (max-width:340px){.quick{gap:10px}.q{font-size:15px;gap:8px}h1{font-size:25px}}
@media (min-width:480px) and (min-height:760px){h1{font-size:32px}}
</style></head>
<body>
<main class="app">
  <div class="scroll">
    <h1>Emergency</h1>
    <p class="sub">Get help or inform your family</p>

    <div class="sos-wrap">
      <span class="ring r1" aria-hidden="true"></span><span class="ring r2" aria-hidden="true"></span><span class="ring r3" aria-hidden="true"></span>
      <button class="sos" aria-describedby="sos-help">SOS</button>
    </div>
    <p class="tap">Tap to send alert</p>
    <p class="desc" id="sos-help">Sends your location, battery and status to your emergency contacts</p>

    <div class="quick">
      <a class="q" href="tel:112"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 3.5l2.4-.5c.5-.1 1 .2 1.2.7l1.1 2.8c.2.5 0 1-.4 1.3L9.3 9.1a12 12 0 0 0 5.6 5.6l1.3-1.6c.3-.4.8-.6 1.3-.4l2.8 1.1c.5.2.8.7.7 1.2l-.5 2.4c-.1.7-.7 1.2-1.4 1.2C10.8 18.6 5.4 13.2 5.4 4.9c0-.7.5-1.3 1.2-1.4z"/></svg>Call 112</a>
      <a class="q" href="sms:?&body=I%20need%20help.%20Please%20contact%20me."><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3.5h14a2.5 2.5 0 0 1 2.5 2.5v9a2.5 2.5 0 0 1-2.5 2.5h-6.2L8 21.2v-3.7H5A2.5 2.5 0 0 1 2.5 15V6A2.5 2.5 0 0 1 5 3.5z"/><path d="M8 9.2h.01M12 9.2h.01M16 9.2h.01" stroke="#fbe9ea" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>Send SMS</a>
    </div>

    <section class="fam" aria-label="Family check-in">
      <a class="fam-row" href="#family">
        <span class="av"><svg viewBox="0 0 24 24" fill="#ef1c24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0z"/></svg></span>
        <span class="fam-t"><b>Family Check-in</b><span>Let your family know you're safe</span></span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <button class="safe"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>I'm Safe</button>
    </section>
  </div>
  <nav class="nav" aria-label="Main">
    <a href="#home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M4 11l8-6.5 8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 6.5l5.5-2 6 2 5.5-2v13l-5.5 2-6-2-5.5 2z"/><path d="M9 4.5v13M15 6.5v13"/></svg>Map</a>
    <a href="#saathi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M11 4.5H8a4 4 0 0 0-4 4v4.2a4 4 0 0 0 4 4h.5V20l3.8-3.3H14a4 4 0 0 0 4-4V11"/><circle cx="17.5" cy="6.5" r="2.5"/><path d="M8.5 10.5h.01M12.5 10.5h.01"/></svg>Saathi</a>
    <a href="#alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0M12 3v2"/></svg>Alerts</a>
    <a href="#more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>More</a>
  </nav>
</main>
</body></html>
