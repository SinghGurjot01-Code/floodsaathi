name: relay
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
concurrency: { group: relay, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r relay/requirements.txt
      - name: Run relay
        run: python relay/run.py --out ./.out --publish
      - name: Deploy to GitHub Pages (fallback storage)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.out
          publish_branch: gh-pages
          force_orphan: true
